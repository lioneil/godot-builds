name: Build

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 300
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7

      - name: Compute the stamp
        id: stamp
        run: |
          set -euo pipefail
          echo "stamp=$(./build.sh stamp)" >> "$GITHUB_OUTPUT"

      - name: Look for an existing release
        id: existing
        env:
          STAMP: ${{ steps.stamp.outputs.stamp }}
        run: |
          set -euo pipefail
          if gh release view "$STAMP" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "Release $STAMP exists; nothing to build." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Install the build tools
        if: steps.existing.outputs.exists == 'false'
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config xz-utils python3-venv \
            libx11-dev libxcursor-dev libxinerama-dev libxi-dev libxrandr-dev libgl-dev \
            libudev-dev libasound2-dev libpulse-dev libwayland-dev libxkbcommon-dev
          python3 -m venv "$RUNNER_TEMP/venv"
          "$RUNNER_TEMP/venv/bin/pip" install -r requirements.txt
          echo "$RUNNER_TEMP/venv/bin" >> "$GITHUB_PATH"

      - name: Build the editor
        if: steps.existing.outputs.exists == 'false'
        run: |
          set -euo pipefail
          start="$(date +%s)"
          ./build.sh build "$RUNNER_TEMP/src" "$RUNNER_TEMP/out"
          tar -C "$RUNNER_TEMP/out" -cJf godot.tar.xz godot
          echo "Build wall time: $(( ($(date +%s) - start) / 60 )) minutes." >> "$GITHUB_STEP_SUMMARY"

      - name: Create the release
        if: steps.existing.outputs.exists == 'false'
        env:
          STAMP: ${{ steps.stamp.outputs.stamp }}
        run: |
          set -euo pipefail
          gh release create "$STAMP" godot.tar.xz --title "Godot $STAMP" \
            --notes "Godot editor for Linux x86_64, built from the patch set in this commit."
